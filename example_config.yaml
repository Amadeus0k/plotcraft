# ============================================================
# plotter.py — example configuration
#
# Usage:
#   python plotter.py example_config.yaml
#
# Data files are resolved under  data/<file>
# Output SVGs are written to     output/<project>/<name>.svg
# ============================================================

project: comparison_exit   # output goes to output/comparison_exit/

plots:

  # ----------------------------------------------------------
  # Single-series plot — no legend (legend: false)
  # fontsize scalar: all text set to 12 pt, ticks/legend 11 pt
  # ----------------------------------------------------------
  - name: no_nozzle_mach          # → output/comparison_exit/no_nozzle_mach.svg
    xlabel: "θ (rad)"
    ylabel: "Mach number (−)"
    width:  3.5                   # inches — single journal column
    height: 2.8
    grid: true
    legend: false                 # suppress legend entirely
    fontsize: 12                  # scalar: sets base size for all text elements
    # fontsize:                   # dict form for fine-grained control:
    #   base:   12                #   sets all; individual keys override it
    #   label:  12                #   axis x/y label size
    #   title:  13                #   plot title size
    #   tick:   10                #   tick label size (x and y)
    #   legend: 10                #   legend text size
    series:
      - label: "No nozzle"
        file:  comparison_exit/data_without_nozzle.csv
        x: theta
        y: Ma
        color: black
        style: line               # "line" or "scatter"

  # ----------------------------------------------------------
  # Single-series with angular rotation and smoothing
  # ----------------------------------------------------------
  - name: nozzle_035_mach
    xlabel: "θ (rad)"
    ylabel: "Mach number (−)"
    width:  3.5
    height: 2.8
    series:
      - label: "Nozzle 0.35"
        file:  comparison_exit/data_with_nozzle.csv
        x: theta
        y: Ma
        color: black
        rotate: 0.6              # radians — wraps to [-π, π]
        # --- smoothing options (pick one) ---
        # Savitzky-Golay + cubic resample (follows data, removes noise)
        smooth: 11               # shorthand: window=11, polyorder=3, resample=500
        # smooth:
        #   method: savgol
        #   window:    21
        #   polyorder: 3
        #   resample:  800
        #
        # Smoothing spline (does NOT pass through exact points)
        # smooth:
        #   method: spline
        #   factor:   0.5        # 0 = interpolating, 1 = very smooth
        #   resample: 500

  # ----------------------------------------------------------
  # Multi-series with zoom inset — legend inside (default placement)
  # ----------------------------------------------------------
  - name: nozzle_comparison_mach_zoom
    xlabel: "θ (rad)"
    ylabel: "Mach number (−)"
    width:  3.5
    height: 2.8
    legend:
      loc: upper left             # standard matplotlib location (inside axes)
    # Optional zoom inset — draws a highlighted box on the main graph
    # and a magnified inset placed automatically in the emptiest corner.
    zoom:
      xmin: -0.3          # x-range to zoom into
      xmax:  0.3
      ymin:  1.5          # y-range to zoom into
      ymax:  2.8
      scale: x3           # magnification factor — x2, x3, x5, x10 etc.
                          # controls the physical size of the inset
      # loc: upper_right  # optional: upper_right | upper_left | lower_left | lower_right
                          # omit for automatic placement (least-populated quadrant)
    series:
      - label: "No nozzle"
        file:  comparison_exit/data_without_nozzle.csv
        x: theta
        y: Ma
        color: red

      - label: "Nozzle 0.35"
        file:  comparison_exit/data_with_nozzle.csv
        x: theta
        y: Ma
        color: black
        rotate: 0.6

      - label: "Nozzle 0.50"
        file:  comparison_exit/data_nozzle_05.csv
        x: theta
        y: Ma
        color: green
        rotate: -1.3

  # ----------------------------------------------------------
  # Multi-series comparison — legend outside right
  # ----------------------------------------------------------
  - name: nozzle_comparison_mach
    xlabel: "θ (rad)"
    ylabel: "Mach number (−)"
    width:  3.5
    height: 2.8
    # xlim: [-3.14159, 3.14159]  # uncomment to set axis limits
    # ylim: [0, 5]
    legend:
      loc: outside right          # outside right | outside left | outside top | outside bottom
                                  # outside upper right | outside center right | outside lower right
                                  # outside upper left  | outside center left  | outside lower left
                                  # outside upper center| outside lower center
    series:
      - label: "No nozzle"
        file:  comparison_exit/data_without_nozzle.csv
        x: theta
        y: Ma
        color: red

      - label: "Nozzle 0.35"
        file:  comparison_exit/data_with_nozzle.csv
        x: theta
        y: Ma
        color: black
        rotate: 0.6

      - label: "Nozzle 0.50"
        file:  comparison_exit/data_nozzle_05.csv
        x: theta
        y: Ma
        color: green
        rotate: -1.3

  - name: nozzle_comparison_pressure
    xlabel: "θ (rad)"
    ylabel: "Pressure (Pa)"
    width:  3.5
    height: 2.8
    legend:
      loc: outside bottom         # legend below the x-axis
      ncol: 3                     # spread entries across 3 columns
    series:
      - label: "No nozzle"
        file:  comparison_exit/data_without_nozzle.csv
        x: theta
        y: p
        color: red

      - label: "Nozzle 0.35"
        file:  comparison_exit/data_with_nozzle.csv
        x: theta
        y: p
        color: black
        rotate: 0.6

      - label: "Nozzle 0.50"
        file:  comparison_exit/data_nozzle_05.csv
        x: theta
        y: p
        color: green
        rotate: -1.3

  - name: nozzle_comparison_temperature
    xlabel: "θ (rad)"
    ylabel: "Temperature (K)"
    width:  3.5
    height: 2.8
    legend:
      loc: outside upper right    # outside the axes, anchored to the top-right corner
      title: "Configuration"      # optional legend title
      ncol: 1
    series:
      - label: "No nozzle"
        file:  comparison_exit/data_without_nozzle.csv
        x: theta
        y: T
        color: red

      - label: "Nozzle 0.35"
        file:  comparison_exit/data_with_nozzle.csv
        x: theta
        y: T
        color: black
        rotate: 0.6

      - label: "Nozzle 0.50"
        file:  comparison_exit/data_nozzle_05.csv
        x: theta
        y: T
        color: green
        rotate: -1.3

# ============================================================
# Multi-panel figures  (key: "figures", not "plots")
# Each entry produces one SVG containing a grid of panels.
# ============================================================

figures:

  # ----------------------------------------------------------
  # 2 × 2 grid — shared legend outside right
  # Same labels across panels get the same color automatically.
  # ----------------------------------------------------------
  - name:   nozzle_comparison_grid    # → output/comparison_exit/nozzle_comparison_grid.svg
    rows:   2
    cols:   2
    width:  7.0                       # total figure width  (inches)
    height: 5.6                       # total figure height (inches)
    sharex: false                     # true → shared x-axis per column
    sharey: false                     # true → shared y-axis per row
    fontsize:                         # fine-grained font size control (applied to all panels)
      base:   10                      #   sets all elements; individual keys override
      title:  11                      #   panel titles slightly larger
      tick:    9                      #   tick labels slightly smaller
    legend:                           # figure-level shared legend (per-panel legend keys ignored)
      loc: outside right              # any "outside *" or standard matplotlib location
      ncol: 1
      title: "Configuration"

    panels:                           # row-major order: left→right, top→bottom

      - xlabel: "θ (rad)"
        ylabel: "Mach (−)"
        title:  "(a) Mach number"
        grid: true
        series:
          - label: "No nozzle"
            file:  comparison_exit/data_without_nozzle.csv
            x: theta
            y: Ma
          - label: "Nozzle 0.35"
            file:  comparison_exit/data_with_nozzle.csv
            x: theta
            y: Ma
            rotate: 0.6
          - label: "Nozzle 0.50"
            file:  comparison_exit/data_nozzle_05.csv
            x: theta
            y: Ma
            rotate: -1.3

      - xlabel: "θ (rad)"
        ylabel: "Pressure (Pa)"
        title:  "(b) Pressure"
        grid: true
        series:
          - label: "No nozzle"
            file:  comparison_exit/data_without_nozzle.csv
            x: theta
            y: p
          - label: "Nozzle 0.35"
            file:  comparison_exit/data_with_nozzle.csv
            x: theta
            y: p
            rotate: 0.6
          - label: "Nozzle 0.50"
            file:  comparison_exit/data_nozzle_05.csv
            x: theta
            y: p
            rotate: -1.3

      - xlabel: "θ (rad)"
        ylabel: "Temperature (K)"
        title:  "(c) Temperature"
        grid: true
        series:
          - label: "No nozzle"
            file:  comparison_exit/data_without_nozzle.csv
            x: theta
            y: T
          - label: "Nozzle 0.35"
            file:  comparison_exit/data_with_nozzle.csv
            x: theta
            y: T
            rotate: 0.6
          - label: "Nozzle 0.50"
            file:  comparison_exit/data_nozzle_05.csv
            x: theta
            y: T
            rotate: -1.3

      - null                          # empty cell — leave bottom-right blank

  # ----------------------------------------------------------
  # 1 × 3 row — per-panel legends, legend outside bottom
  # ----------------------------------------------------------
  - name:   nozzle_row
    rows:   1
    cols:   3
    width:  7.0
    height: 2.8
    legend:
      loc:  outside bottom
      ncol: 3                         # one row of entries below all panels

    panels:
      - xlabel: "θ (rad)"
        ylabel: "Mach (−)"
        title:  "(a)"
        series:
          - label: "No nozzle"
            file:  comparison_exit/data_without_nozzle.csv
            x: theta
            y: Ma
          - label: "Nozzle 0.35"
            file:  comparison_exit/data_with_nozzle.csv
            x: theta
            y: Ma
            rotate: 0.6

      - xlabel: "θ (rad)"
        ylabel: "Pressure (Pa)"
        title:  "(b)"
        series:
          - label: "No nozzle"
            file:  comparison_exit/data_without_nozzle.csv
            x: theta
            y: p
          - label: "Nozzle 0.35"
            file:  comparison_exit/data_with_nozzle.csv
            x: theta
            y: p
            rotate: 0.6

      - xlabel: "θ (rad)"
        ylabel: "Temperature (K)"
        title:  "(c)"
        series:
          - label: "No nozzle"
            file:  comparison_exit/data_without_nozzle.csv
            x: theta
            y: T
          - label: "Nozzle 0.35"
            file:  comparison_exit/data_with_nozzle.csv
            x: theta
            y: T
            rotate: 0.6
